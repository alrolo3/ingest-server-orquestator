version: "1"
name: RAG query retrieval tool v2 sparse dense
enabled: true
description: Semantic-only, conversation-aware RAG retrieval workflow for open-rag-embeddings-v4. Rewrites the current user question with recent conversation context into a standalone retrieval query, searches dense and sparse semantic branches with RRF, expands same-page and neighboring-page context, and returns retrieved chunks for grounded Agent Builder answers.

triggers:
  - type: manual

inputs:
  - name: question
    type: string
    required: true
    description: The current user question exactly as asked in the chat turn.
    default: "What information is available in the knowledge base?"

  - name: conversation_context
    type: string
    required: false
    description: Compact summary of relevant previous chat turns, including unresolved references. Use an empty string when there is no useful prior context.
    default: ""

consts:
  indexName: open-rag-embeddings-v4
  resultSize: 10
  expansionSize: 30

steps:
  - name: conversation_aware_query_rewrite
    type: ai.prompt
    with:
      temperature: 0
      systemPrompt: |-
        You rewrite chatbot follow-up questions into standalone retrieval queries.
        You never answer the user's question.
      prompt: |-
        Rewrite the current user question for semantic retrieval over a multilingual knowledge base.

        Conversation context:
        {{ inputs.conversation_context }}

        Current user question:
        {{ inputs.question }}

        Requirements:
        - Do not answer the question.
        - question_original must be the current user question exactly.
        - standalone_question must be a self-contained version of the user question.
        - If the conversation context is empty, irrelevant, or not needed, standalone_question must preserve the current question.
        - Resolve references like "it", "that", "those", "the previous one", "this document", "the rule", "the second option", and similar follow-up phrasing when the context makes the reference clear.
        - Do not introduce facts, constraints, entities, dates, product names, rules, commands, filenames, URLs, or assumptions not present in the current question or conversation context.
        - Preserve domain-specific names, proper nouns, rules terms, spell names, product names, model names, commands, file names, abbreviations, and exact identifiers.
        - answer_language must be the language the final answer should use, using "en" or "es". Prefer the user's current question language.
      schema:
        type: object
        additionalProperties: false
        properties:
          question_original:
            type: string
          standalone_question:
            type: string
          answer_language:
            type: string
            enum:
              - en
              - es
        required:
          - question_original
          - standalone_question
          - answer_language

  - name: rrf_sparse_dense_retrieval
    type: elasticsearch.request
    with:
      method: POST
      path: /{{ consts.indexName }}/_search
      body:
        size: "${{ consts.resultSize }}"
        track_total_hits: false
        _source:
          - record_id
          - chunk_id
          - document_id
          - clean_title
          - title
          - content
          - headings
          - page_number
          - page_numbers
          - page_start
          - page_end
          - source_file_name
          - language
          - content_kind
          - chunk_quality
        retriever:
          rrf:
            rank_window_size: 100
            rank_constant: 20
            filter:
              - term:
                  record_type: chunk
              - term:
                  searchable: true
              - term:
                  boilerplate: false
            retrievers:
              - standard:
                  query:
                    semantic:
                      field: content_dense
                      query: "{{ steps.conversation_aware_query_rewrite.output.content.standalone_question }}"

              - standard:
                  query:
                    semantic:
                      field: content_sparse
                      query: "{{ steps.conversation_aware_query_rewrite.output.content.standalone_question }}"

              - standard:
                  query:
                    semantic:
                      field: clean_title
                      query: "{{ steps.conversation_aware_query_rewrite.output.content.standalone_question }}"

              - standard:
                  query:
                    semantic:
                      field: headings
                      query: "{{ steps.conversation_aware_query_rewrite.output.content.standalone_question }}"

  - name: map_rrf_hits
    type: data.map
    items: "${{ steps.rrf_sparse_dense_retrieval.output.hits.hits }}"
    with:
      fields:
        elastic_id: "{{ item._id }}"
        rank: "{{ item._rank }}"
        score: "{{ item._score }}"
        record_id: "{{ item._source.record_id }}"
        chunk_id: "{{ item._source.chunk_id }}"
        document_id: "{{ item._source.document_id }}"
        title: "{{ item._source.title }}"
        clean_title: "{{ item._source.clean_title }}"
        headings: "${{ item._source.headings }}"
        source_file_name: "{{ item._source.source_file_name }}"
        language: "{{ item._source.language }}"
        page_number: "{{ item._source.page_number }}"
        page_numbers: "${{ item._source.page_numbers }}"
        page_start: "{{ item._source.page_start }}"
        page_end: "{{ item._source.page_end }}"
        content_kind: "{{ item._source.content_kind }}"
        chunk_quality: "{{ item._source.chunk_quality }}"

  - name: same_page_neighbor_expansion
    type: elasticsearch.request
    with:
      method: POST
      path: /{{ consts.indexName }}/_search
      headers:
        Content-Type: application/json
        Accept: application/json
      body: |-
        {
          "size": {{ consts.expansionSize }},
          "track_total_hits": false,
          "_source": [
            "record_id",
            "chunk_id",
            "document_id",
            "clean_title",
            "title",
            "content",
            "headings",
            "page_number",
            "page_numbers",
            "page_start",
            "page_end",
            "source_file_name",
            "language",
            "content_kind",
            "chunk_quality"
          ],
          "query": {
            "bool": {
              "filter": [
                { "term": { "record_type": "chunk" } },
                { "term": { "searchable": true } },
                { "term": { "boilerplate": false } }
              ],
              "should": [
                {% for hit in steps.rrf_sparse_dense_retrieval.output.hits.hits %}
                {
                  "ids": {
                    "values": [
                      "{{ hit._id }}"
                    ]
                  }
                },
                {% assign page_start = hit._source.page_start | default: hit._source.page_end | default: 0 %}
                {% assign page_end = hit._source.page_end | default: hit._source.page_start | default: page_start %}
                {% assign page_number = hit._source.page_number | default: page_start %}
                {
                  "constant_score": {
                    "filter": {
                      "bool": {
                        "filter": [
                          { "term": { "document_id": "{{ hit._source.document_id }}" } }
                        ],
                        "should": [
                          { "range": { "page_number": { "gte": {{ page_number | minus: 1 }}, "lte": {{ page_number | plus: 1 }} } } },
                          { "terms": { "page_numbers": [{{ page_number | minus: 1 }}, {{ page_number }}, {{ page_number | plus: 1 }}] } },
                          {
                            "bool": {
                              "filter": [
                                { "range": { "page_start": { "lte": {{ page_end | plus: 1 }} } } },
                                { "range": { "page_end": { "gte": {{ page_start | minus: 1 }} } } }
                              ]
                            }
                          }
                        ],
                        "minimum_should_match": 1
                      }
                    }
                  }
                }{% unless forloop.last %},{% endunless %}
                {% endfor %}
              ],
              "minimum_should_match": 1
            }
          }
        }

  - name: map_expanded_context_hits
    type: data.map
    items: "${{ steps.same_page_neighbor_expansion.output.hits.hits }}"
    with:
      fields:
        elastic_id: "{{ item._id }}"
        score: "{{ item._score }}"
        record_id: "{{ item._source.record_id }}"
        chunk_id: "{{ item._source.chunk_id }}"
        document_id: "{{ item._source.document_id }}"
        title: "{{ item._source.title }}"
        clean_title: "{{ item._source.clean_title }}"
        headings: "${{ item._source.headings }}"
        content: "{{ item._source.content }}"
        source_file_name: "{{ item._source.source_file_name }}"
        language: "{{ item._source.language }}"
        page_number: "{{ item._source.page_number }}"
        page_numbers: "${{ item._source.page_numbers }}"
        page_start: "{{ item._source.page_start }}"
        page_end: "{{ item._source.page_end }}"
        content_kind: "{{ item._source.content_kind }}"
        chunk_quality: "{{ item._source.chunk_quality }}"

  - name: rag_retrieval_response
    type: data.set
    with:
      question: "{{ inputs.question }}"
      conversation_context_used: "{{ inputs.conversation_context }}"
      standalone_question: "{{ steps.conversation_aware_query_rewrite.output.content.standalone_question }}"
      answer_language: "{{ steps.conversation_aware_query_rewrite.output.content.answer_language }}"
      retrieval_strategy: Conversation-aware standalone query rewrite; semantic-only RRF over dense content_dense, sparse content, sparse clean title, and sparse headings branches; followed by same-page and neighboring-page expansion that always retains first-stage seed hits.
      documents: "${{ steps.map_expanded_context_hits.output }}"
      initial_rrf_documents: "${{ steps.map_rrf_hits.output }}"
      instruction: Answer the current user question using only documents as grounding context. initial_rrf_documents is diagnostic metadata only and must not be used as answer evidence. Answer in answer_language. If documents are empty or insufficient, say that the available documents do not provide enough information. Cite/reference document titles, clean titles, source file names, and pages when available. Do not invent facts, URLs, citations, page numbers, or details not present in documents.
