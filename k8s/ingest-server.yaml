apiVersion: v1
kind: Secret
metadata:
  name: ingest-server-secrets
type: Opaque
stringData:
  ELASTIC_API_KEY: replace-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-server-config
data:
  APP_ENV: prod
  INGEST_LOG_LEVEL: INFO
  INGEST_WORKER_MAX_WORKERS: "1"
  NVIDIA_VISIBLE_DEVICES: "4"
  DOCLING_PICTURE_DESCRIPTION_URL: http://vllm-qwen35-9b:8007/v1/chat/completions
  DOCLING_OCR_ENABLED: "true"
  DOCLING_OCR_ENGINE: surya
  DOCLING_OCR_LANGS: es,en
  DOCLING_MINERU_DEVICE: auto
  DOCLING_MINERU_DTYPE: auto
  DOCLING_MINERU_BATCH_SIZE: "1"
  DOCLING_MINERU_IMAGE_ANALYSIS: "false"
  DOCLING_SURYA_SCALE: "2.0"
  DOCLING_SURYA_CONFIDENCE: "1.0"
  DOCLING_SURYA_INFERENCE_URL: http://surya-vllm:8000/v1
  DOCLING_SURYA_INFERENCE_BACKEND: vllm
  DOCLING_SURYA_INFERENCE_PARALLEL: "8"
  DOCLING_SURYA_KEEP_ALIVE: "true"
  DOCLING_FORCE_FULL_PAGE_OCR: "false"
  DOCLING_OCR_BITMAP_AREA_THRESHOLD: "0.05"
  DOCLING_OCR_BATCH_SIZE: "8"
  DOCLING_LAYOUT_BATCH_SIZE: "4"
  DOCLING_TABLE_BATCH_SIZE: "8"
  DOCLING_QUEUE_MAX_SIZE: "16"
  DOCLING_ACCELERATOR_THREADS: "16"
  DOCLING_PICTURE_DESCRIPTION_ENABLED: "true"
  DOCLING_PICTURE_CLASSIFICATION_ENABLED: "true"
  DOCLING_PICTURE_DESCRIPTION_CONCURRENCY: "24"
  DOCLING_PICTURE_DESCRIPTION_TIMEOUT: "240"
  DOCLING_IMAGES_SCALE: "2.0"
  DOCLING_TABLE_MODE: accurate
  DOCLING_CODE_ENRICHMENT_ENABLED: "false"
  ELASTIC_URL: https://elasticsearch-gpu-indexer:9200
  ELASTIC_HOSTS: https://elasticsearch-gpu-indexer:9200
  ELASTIC_INDEX_NAME: open-rag-embeddings-v4
  ELASTIC_PIPELINE_NAME: open_rag_embeddings_v4_multilingual_semantic_pipeline
  ELASTIC_INFERENCE_ID: qwen3-embedding-4b
  ELASTIC_VERIFY_CERTS: "false"
  ELASTIC_SSL_SHOW_WARN: "false"
  ELASTIC_HTTP_COMPRESS: "true"
  ELASTIC_BULK_API_TIMEOUT: 30m
  ELASTIC_BULK_REQUEST_TIMEOUT_SECONDS: "1800"
  ELASTIC_BULK_BATCH_SIZE: "10"
  ELASTIC_BULK_MAX_RETRIES: "8"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-gradio-config
data:
  INGEST_API_URL: http://ingest-server:8000
  INGEST_DOWNLOAD_BASE_URL: ""
  INGEST_POLL_SECONDS: "3"
  INGEST_TIMEOUT_SECONDS: "60"
  GRADIO_ROOT_PATH: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-server
  labels:
    app.kubernetes.io/name: ingest-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-server
    spec:
      runtimeClassName: nvidia
      containers:
        - name: ingest-server
          image: ingest-server-orquestator:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - src.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --log-level
            - info
            - --access-log
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ingest-server-config
            - secretRef:
                name: ingest-server-secrets
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              valueFrom:
                configMapKeyRef:
                  name: ingest-server-config
                  key: NVIDIA_VISIBLE_DEVICES
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: ingest-data
              mountPath: /uploads
              subPath: uploads
            - name: ingest-data
              mountPath: /outputs
              subPath: outputs
            - name: models-llm
              mountPath: /tokenizer
              subPath: tokenizers/qwen3-embedding-4b
              readOnly: true
            - name: models-llm
              mountPath: /docling-models
              subPath: docling
              readOnly: true
      volumes:
        - name: ingest-data
          persistentVolumeClaim:
            claimName: ingest-data-pvc
        - name: models-llm
          persistentVolumeClaim:
            claimName: models-llm-pvc
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-server
  labels:
    app.kubernetes.io/name: ingest-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingest-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-server-api-from-gradio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingest-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingest-gradio
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-gradio
  labels:
    app.kubernetes.io/name: ingest-gradio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-gradio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-gradio
    spec:
      containers:
        - name: ingest-gradio
          image: ingest-server-orquestator:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - gradio_file_ingest/app.py
          ports:
            - name: http
              containerPort: 7860
          envFrom:
            - configMapRef:
                name: ingest-gradio-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-gradio
  labels:
    app.kubernetes.io/name: ingest-gradio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingest-gradio
  ports:
    - name: http
      port: 7860
      targetPort: http
