apiVersion: v1
kind: Secret
metadata:
  name: ingest-server-secrets
type: Opaque
stringData:
  ELASTIC_API_KEY: replace-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-server-config
data:
  APP_ENV: prod
  INGEST_LOG_LEVEL: INFO
  INGEST_WORKER_MAX_WORKERS: "1"
  NVIDIA_VISIBLE_DEVICES: "4"
  DOCLING_PICTURE_DESCRIPTION_URL: http://vllm-qwen35-9b:8007/v1/chat/completions
  DOCLING_PICTURE_DESCRIPTION_MODEL: Qwen3.5-9B
  DOCLING_OCR_ENABLED: "true"
  DOCLING_OCR_ENGINE: surya
  DOCLING_OCR_LANGS: es,en
  DOCLING_MINERU_DEVICE: auto
  DOCLING_MINERU_DTYPE: auto
  DOCLING_MINERU_BATCH_SIZE: "1"
  DOCLING_MINERU_IMAGE_ANALYSIS: "false"
  DOCLING_SURYA_SCALE: "2.0"
  DOCLING_SURYA_CONFIDENCE: "1.0"
  DOCLING_SURYA_INFERENCE_URL: http://surya-vllm:8000/v1
  DOCLING_SURYA_INFERENCE_BACKEND: vllm
  DOCLING_SURYA_INFERENCE_PARALLEL: "8"
  DOCLING_SURYA_KEEP_ALIVE: "true"
  DOCLING_FORCE_FULL_PAGE_OCR: "false"
  DOCLING_OCR_BITMAP_AREA_THRESHOLD: "0.05"
  DOCLING_OCR_BATCH_SIZE: "8"
  DOCLING_LAYOUT_BATCH_SIZE: "4"
  DOCLING_TABLE_BATCH_SIZE: "8"
  DOCLING_QUEUE_MAX_SIZE: "16"
  DOCLING_ACCELERATOR_THREADS: "16"
  DOCLING_PICTURE_DESCRIPTION_ENABLED: "true"
  DOCLING_PICTURE_CLASSIFICATION_ENABLED: "true"
  DOCLING_PICTURE_DESCRIPTION_CONCURRENCY: "24"
  DOCLING_PICTURE_DESCRIPTION_TIMEOUT: "240"
  DOCLING_IMAGES_SCALE: "2.0"
  DOCLING_TABLE_MODE: accurate
  DOCLING_CODE_ENRICHMENT_ENABLED: "false"
  ELASTIC_URL: https://elasticsearch-gpu-indexer:9200
  ELASTIC_HOSTS: https://elasticsearch-gpu-indexer:9200
  ELASTIC_INDEX_NAME: open-rag-embeddings-v4
  ELASTIC_PIPELINE_NAME: open_rag_embeddings_v4_multilingual_semantic_pipeline
  ELASTIC_INFERENCE_ID: qwen3-embedding-4b
  ELASTIC_VERIFY_CERTS: "false"
  ELASTIC_SSL_SHOW_WARN: "false"
  ELASTIC_HTTP_COMPRESS: "true"
  ELASTIC_BULK_API_TIMEOUT: 30m
  ELASTIC_BULK_REQUEST_TIMEOUT_SECONDS: "1800"
  ELASTIC_BULK_BATCH_SIZE: "10"
  ELASTIC_BULK_MAX_RETRIES: "8"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-frontend-config
data:
  INGEST_API_URL: http://ingest-server:8000
  PORT: "3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-server
  labels:
    app.kubernetes.io/name: ingest-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-server
    spec:
      runtimeClassName: nvidia
      containers:
        - name: ingest-server
          image: ingest-server-orquestator:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - src.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --log-level
            - info
            - --access-log
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ingest-server-config
            - secretRef:
                name: ingest-server-secrets
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              valueFrom:
                configMapKeyRef:
                  name: ingest-server-config
                  key: NVIDIA_VISIBLE_DEVICES
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: ingest-data
              mountPath: /uploads
              subPath: uploads
            - name: ingest-data
              mountPath: /outputs
              subPath: outputs
            - name: models-llm
              mountPath: /tokenizer
              subPath: tokenizers/qwen3-embedding-4b
              readOnly: true
            - name: models-llm
              mountPath: /docling-models
              subPath: docling
              readOnly: true
      volumes:
        - name: ingest-data
          persistentVolumeClaim:
            claimName: ingest-data-pvc
        - name: models-llm
          persistentVolumeClaim:
            claimName: models-llm-pvc
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-server
  labels:
    app.kubernetes.io/name: ingest-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingest-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-server-api-from-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingest-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingest-frontend
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-frontend
  labels:
    app.kubernetes.io/name: ingest-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-frontend
    spec:
      containers:
        - name: ingest-frontend
          image: ingest-server-orquestator-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ingest-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-frontend
  labels:
    app.kubernetes.io/name: ingest-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingest-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-frontend-from-traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingest-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: l5d-elastic-service
spec:
  headers:
    customRequestHeaders:
      l5d-dst-override: quickstart-es-http.default.svc.cluster.local:9200
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: l5d-headlamp-service
spec:
  headers:
    customRequestHeaders:
      l5d-dst-override: headlamp.kube-system.svc.cluster.local:80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: l5d-inference-service
spec:
  headers:
    customRequestHeaders:
      l5d-dst-override: inference-service.default.svc.cluster.local:4000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: l5d-frontend-service
spec:
  headers:
    customRequestHeaders:
      l5d-dst-override: ingest-frontend.default.svc.cluster.local:3000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: l5d-kibana-service
spec:
  headers:
    customRequestHeaders:
      l5d-dst-override: quickstart-kb-http.default.svc.cluster.local:5601
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: l5d-openwebui-service
spec:
  headers:
    customRequestHeaders:
      l5d-dst-override: openwebui-service.default.svc.cluster.local:8080
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: elastic-eck-transport
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: kibana-eck-transport
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: simona-apps-ingressroute
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`inference.simona.local`) && PathPrefix(`/`)
      middlewares:
        - name: l5d-inference-service
      services:
        - name: inference-service
          nativeLB: true
          port: 4000
    - kind: Rule
      match: Host(`gradio.simona.local`) && PathPrefix(`/`)
      middlewares:
        - name: l5d-frontend-service
      services:
        - name: ingest-frontend
          nativeLB: true
          port: 3000
    - kind: Rule
      match: Host(`kibana.simona.local`) && PathPrefix(`/`)
      middlewares:
        - name: l5d-kibana-service
      services:
        - name: quickstart-kb-http
          nativeLB: true
          passHostHeader: true
          port: 5601
          scheme: https
          serversTransport: kibana-eck-transport
    - kind: Rule
      match: Host(`openwebui.simona.local`) && PathPrefix(`/`)
      middlewares:
        - name: l5d-openwebui-service
      services:
        - name: openwebui-service
          nativeLB: true
          port: 8080
    - kind: Rule
      match: Host(`elastic.simona.local`) && PathPrefix(`/`)
      middlewares:
        - name: l5d-elastic-service
      services:
        - name: quickstart-es-http
          nativeLB: true
          passHostHeader: true
          port: 9200
          scheme: https
          serversTransport: elastic-eck-transport
    - kind: Rule
      match: Host(`headlamp.simona.local`) && PathPrefix(`/`)
      middlewares:
        - name: l5d-headlamp-service
      services:
        - name: headlamp
          namespace: kube-system
          nativeLB: true
          port: 80
  tls:
    secretName: simona-apps-tls
