apiVersion: v1
kind: ConfigMap
metadata:
  name: surya-vllm-config
data:
  NVIDIA_VISIBLE_DEVICES: "4"
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_API_KEY: EMPTY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surya-vllm
  labels:
    app.kubernetes.io/name: surya-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: surya-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surya-vllm
    spec:
      runtimeClassName: nvidia
      containers:
        - name: surya-vllm
          image: vllm/vllm-openai:v0.20.1
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /model
            - --api-key
            - EMPTY
            - --no-enforce-eager
            - --max-num-seqs
            - "32"
            - --dtype
            - bfloat16
            - --max-model-len
            - "18000"
            - --max-num-batched-tokens
            - "8192"
            - --gpu-memory-utilization
            - "0.1"
            - --enable-prefix-caching
            - --mm-processor-kwargs
            - '{"min_pixels":3136,"max_pixels":6291456}'
            - --served-model-name
            - datalab-to/surya-ocr-2
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: surya-vllm-config
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              valueFrom:
                configMapKeyRef:
                  name: surya-vllm-config
                  key: NVIDIA_VISIBLE_DEVICES
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: models-llm
              mountPath: /model
              subPath: surya/surya-ocr-2
              readOnly: true
            - name: vllm-cache
              mountPath: /root/.cache/vllm
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models-llm
          persistentVolumeClaim:
            claimName: models-llm-pvc
            readOnly: true
        - name: vllm-cache
          persistentVolumeClaim:
            claimName: vllm-cache-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: surya-vllm
  labels:
    app.kubernetes.io/name: surya-vllm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: surya-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surya-vllm-from-ingest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: surya-vllm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingest-server
      ports:
        - protocol: TCP
          port: 8000
