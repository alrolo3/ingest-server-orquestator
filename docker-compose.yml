services:
  ingest-api:
    build:
      context: ..
      dockerfile: ingest-server-orquestator/Dockerfile
    image: ingest-server-orquestator:latest
    pull_policy: build
    container_name: ingest-server-orquestator-api
    runtime: nvidia
    restart: unless-stopped

    command:
      - python
      - -m
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --log-level
      - info
      - --access-log

    environment:
      APP_ENV: "${INGEST_APP_ENV:-local}"
      INGEST_LOG_LEVEL: "${INGEST_LOG_LEVEL:-INFO}"
      DOCLING_PICTURE_DESCRIPTION_URL: "${INGEST_DOCLING_PICTURE_DESCRIPTION_URL:-http://vllm-qwen35-9b:8007/v1/chat/completions}"
      ELASTIC_URL: "${INGEST_ELASTIC_URL:-https://elasticsearch-gpu-indexer:9200}"
      ELASTIC_HOSTS: "${INGEST_ELASTIC_HOSTS:-https://elasticsearch-gpu-indexer:9200}"
      ELASTIC_API_KEY: "${INGEST_ELASTIC_API_KEY:-}"
      ELASTIC_INDEX_NAME: "${INGEST_ELASTIC_INDEX_NAME:-open-rag-embeddings-v3}"
      ELASTIC_PIPELINE_NAME: "${INGEST_ELASTIC_PIPELINE_NAME:-open_rag_embeddings_v3_multilingual_semantic_pipeline}"
      ELASTIC_INFERENCE_ID: "${INGEST_ELASTIC_INFERENCE_ID:-qwen3-embedding-4b}"
      ELASTIC_VERIFY_CERTS: "${INGEST_ELASTIC_VERIFY_CERTS:-false}"
      ELASTIC_SSL_SHOW_WARN: "${INGEST_ELASTIC_SSL_SHOW_WARN:-false}"
      NVIDIA_VISIBLE_DEVICES: "${INGEST_NVIDIA_VISIBLE_DEVICES:-4}"
      NVIDIA_DRIVER_CAPABILITIES: "${INGEST_NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${INGEST_GPU_DEVICE_ID:-4}"
              capabilities:
                - gpu

    volumes:
      - ${EXP101_DATASTORE_ROOT:-/datastore/experimento-101}/ingest-uploads:/uploads
      - ${EXP101_DATASTORE_ROOT:-/datastore/experimento-101}/ingest-outputs:/outputs
      - /datastore/models/tokenizers/qwen3-embedding-4b:/tokenizer:ro
      - /datastore/models/docling:/docling-models:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - exp101_services
      - exp101_elastic_private
      - exp101_llm_private

  ingest-gradio:
    image: ingest-server-orquestator:latest
    container_name: ingest-server-orquestator-gradio
    restart: unless-stopped
    depends_on:
      ingest-api:
        condition: service_started

    command:
      - python
      - gradio_file_ingest/app.py

    environment:
      INGEST_API_URL: "${INGEST_GRADIO_API_URL:-http://ingest-api:8000}"
      INGEST_POLL_SECONDS: "${INGEST_POLL_SECONDS:-3}"
      INGEST_TIMEOUT_SECONDS: "${INGEST_TIMEOUT_SECONDS:-60}"
      GRADIO_ROOT_PATH: "${INGEST_GRADIO_ROOT_PATH:-}"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7860/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - exp101_services

networks:
  exp101_services:
    external: true
    name: ${EXP101_SERVICES_NETWORK:-exp101_services}
  exp101_elastic_private:
    external: true
    name: ${EXP101_ELASTIC_NETWORK:-exp101_elastic_private}
  exp101_llm_private:
    external: true
    name: ${EXP101_LLM_NETWORK:-exp101_llm_private}
