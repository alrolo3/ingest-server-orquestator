services:
  ingest-api:
    build:
      context: ..
      dockerfile: ingest-server-orquestator/Dockerfile
    image: ingest-server-orquestator:latest
    pull_policy: build
    container_name: ingest-server-orquestator-api
    runtime: nvidia
    restart: unless-stopped

    command:
      - python
      - -m
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --log-level
      - info
      - --access-log

    environment:
      APP_ENV: "${INGEST_APP_ENV:-local}"
      INGEST_LOG_LEVEL: "${INGEST_LOG_LEVEL:-INFO}"
      INGEST_WORKER_MAX_WORKERS: "${INGEST_WORKER_MAX_WORKERS:-1}"
      DOCLING_PICTURE_DESCRIPTION_URL: "${INGEST_DOCLING_PICTURE_DESCRIPTION_URL:-http://vllm-qwen35-9b:8007/v1/chat/completions}"
      DOCLING_OCR_ENABLED: "${INGEST_DOCLING_OCR_ENABLED:-true}"
      DOCLING_OCR_ENGINE: "${INGEST_DOCLING_OCR_ENGINE:-easyocr}"
      DOCLING_OCR_LANGS: "${INGEST_DOCLING_OCR_LANGS:-es,en}"
      DOCLING_MINERU_DEVICE: "${INGEST_DOCLING_MINERU_DEVICE:-auto}"
      DOCLING_MINERU_DTYPE: "${INGEST_DOCLING_MINERU_DTYPE:-auto}"
      DOCLING_MINERU_BATCH_SIZE: "${INGEST_DOCLING_MINERU_BATCH_SIZE:-1}"
      DOCLING_MINERU_IMAGE_ANALYSIS: "${INGEST_DOCLING_MINERU_IMAGE_ANALYSIS:-false}"
      DOCLING_SURYA_SCALE: "${INGEST_DOCLING_SURYA_SCALE:-2.0}"
      DOCLING_SURYA_CONFIDENCE: "${INGEST_DOCLING_SURYA_CONFIDENCE:-1.0}"
      DOCLING_SURYA_INFERENCE_URL: "${INGEST_DOCLING_SURYA_INFERENCE_URL:-}"
      DOCLING_SURYA_INFERENCE_BACKEND: "${INGEST_DOCLING_SURYA_INFERENCE_BACKEND:-}"
      DOCLING_SURYA_INFERENCE_PARALLEL: "${INGEST_DOCLING_SURYA_INFERENCE_PARALLEL:-8}"
      DOCLING_SURYA_KEEP_ALIVE: "${INGEST_DOCLING_SURYA_KEEP_ALIVE:-true}"
      DOCLING_FORCE_FULL_PAGE_OCR: "${INGEST_DOCLING_FORCE_FULL_PAGE_OCR:-false}"
      DOCLING_OCR_BITMAP_AREA_THRESHOLD: "${INGEST_DOCLING_OCR_BITMAP_AREA_THRESHOLD:-0.05}"
      DOCLING_OCR_BATCH_SIZE: "${INGEST_DOCLING_OCR_BATCH_SIZE:-8}"
      DOCLING_LAYOUT_BATCH_SIZE: "${INGEST_DOCLING_LAYOUT_BATCH_SIZE:-4}"
      DOCLING_TABLE_BATCH_SIZE: "${INGEST_DOCLING_TABLE_BATCH_SIZE:-8}"
      DOCLING_QUEUE_MAX_SIZE: "${INGEST_DOCLING_QUEUE_MAX_SIZE:-16}"
      DOCLING_ACCELERATOR_THREADS: "${INGEST_DOCLING_ACCELERATOR_THREADS:-8}"
      DOCLING_PICTURE_DESCRIPTION_ENABLED: "${INGEST_DOCLING_PICTURE_DESCRIPTION_ENABLED:-true}"
      DOCLING_PICTURE_CLASSIFICATION_ENABLED: "${INGEST_DOCLING_PICTURE_CLASSIFICATION_ENABLED:-true}"
      DOCLING_PICTURE_DESCRIPTION_CONCURRENCY: "${INGEST_DOCLING_PICTURE_DESCRIPTION_CONCURRENCY:-16}"
      DOCLING_PICTURE_DESCRIPTION_TIMEOUT: "${INGEST_DOCLING_PICTURE_DESCRIPTION_TIMEOUT:-240}"
      DOCLING_IMAGES_SCALE: "${INGEST_DOCLING_IMAGES_SCALE:-2.0}"
      DOCLING_TABLE_MODE: "${INGEST_DOCLING_TABLE_MODE:-accurate}"
      DOCLING_CODE_ENRICHMENT_ENABLED: "${INGEST_DOCLING_CODE_ENRICHMENT_ENABLED:-false}"
      ELASTIC_URL: "${INGEST_ELASTIC_URL:-https://elasticsearch-gpu-indexer:9200}"
      ELASTIC_HOSTS: "${INGEST_ELASTIC_HOSTS:-https://elasticsearch-gpu-indexer:9200}"
      ELASTIC_API_KEY: "${INGEST_ELASTIC_API_KEY:-}"
      ELASTIC_INDEX_NAME: "${INGEST_ELASTIC_INDEX_NAME:-open-rag-embeddings-v4}"
      ELASTIC_PIPELINE_NAME: "${INGEST_ELASTIC_PIPELINE_NAME:-open_rag_embeddings_v4_multilingual_semantic_pipeline}"
      ELASTIC_INFERENCE_ID: "${INGEST_ELASTIC_INFERENCE_ID:-qwen3-embedding-4b}"
      ELASTIC_VERIFY_CERTS: "${INGEST_ELASTIC_VERIFY_CERTS:-false}"
      ELASTIC_SSL_SHOW_WARN: "${INGEST_ELASTIC_SSL_SHOW_WARN:-false}"
      ELASTIC_HTTP_COMPRESS: "${INGEST_ELASTIC_HTTP_COMPRESS:-true}"
      ELASTIC_BULK_API_TIMEOUT: "${INGEST_ELASTIC_BULK_API_TIMEOUT:-30m}"
      ELASTIC_BULK_REQUEST_TIMEOUT_SECONDS: "${INGEST_ELASTIC_BULK_REQUEST_TIMEOUT_SECONDS:-1800}"
      ELASTIC_BULK_BATCH_SIZE: "${INGEST_ELASTIC_BULK_BATCH_SIZE:-10}"
      ELASTIC_BULK_MAX_RETRIES: "${INGEST_ELASTIC_BULK_MAX_RETRIES:-8}"
      NVIDIA_VISIBLE_DEVICES: "${INGEST_NVIDIA_VISIBLE_DEVICES:-4}"
      NVIDIA_DRIVER_CAPABILITIES: "${INGEST_NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${INGEST_GPU_DEVICE_ID:-4}"
              capabilities:
                - gpu

    volumes:
      - ${EXP101_DATASTORE_ROOT:-/datastore/experimento-101}/ingest-uploads:/uploads
      - ${EXP101_DATASTORE_ROOT:-/datastore/experimento-101}/ingest-outputs:/outputs
      - /datastore/models/tokenizers/qwen3-embedding-4b:/tokenizer:ro
      - /datastore/models/docling:/docling-models:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - exp101_services
      - exp101_elastic_private
      - exp101_llm_private

  ingest-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: ingest-server-orquestator-frontend:latest
    pull_policy: build
    container_name: ingest-server-orquestator-frontend
    restart: unless-stopped
    depends_on:
      ingest-api:
        condition: service_started

    environment:
      INGEST_API_URL: "${INGEST_FRONTEND_API_URL:-http://ingest-api:8000}"
      PORT: "3000"

    ports:
      - "${INGEST_FRONTEND_PORT:-3000}:3000"

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - exp101_services

networks:
  exp101_services:
    external: true
    name: ${EXP101_SERVICES_NETWORK:-exp101_services}
  exp101_elastic_private:
    external: true
    name: ${EXP101_ELASTIC_NETWORK:-exp101_elastic_private}
  exp101_llm_private:
    external: true
    name: ${EXP101_LLM_NETWORK:-exp101_llm_private}
